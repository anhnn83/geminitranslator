name: "Build & Publish Cross-Platform Release"

# Kịch bản sẽ tự động chạy khi bạn gõ lệnh tạo tag (VD: v1.0.0) hoặc chạy thủ công trên web GitHub
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" chủ động trên giao diện web của GitHub

jobs:
  publish-tauri:
    permissions:
      contents: write # Cấp quyền tối cao để máy ảo có thể tự tạo mục Release và upload file cài đặt lên GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest" # Máy ảo Windows để build file .exe / .msi
            args: ""
          - platform: "ubuntu-22.04"    # Máy ảo Linux để build file .deb / .AppImage
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # 1. Kéo mã nguồn từ Repository của bạn vào máy ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js (Frontend)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Cài đặt trình biên dịch Rust stable (Backend)
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 4. Kích hoạt bộ nhớ đệm (Cache) giúp tăng tốc độ build Rust cho các lần sau (tiết kiệm phút build)
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 5. Cài đặt các gói phụ trợ hệ thống (Chỉ chạy trên máy ảo Ubuntu Linux)
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xclip

      # 6. Cài đặt các thư viện Frontend (node_modules)
      - name: Install frontend dependencies
        run: npm install

      # 7. Khởi chạy Action chính chủ của Tauri để tự động biên dịch và phát hành bản cài đặt
      - name: Build and Publish App Artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token bảo mật tự động của GitHub để cấp quyền cho Action
        with:
          tagName: app-v__VERSION__ # Tự động lấy số version trong file tauri.conf.json để đặt tên bản Release
          releaseName: "Gemini Translator v__VERSION__"
          releaseBody: "Automated release generated by GitHub Actions. Optimized for Windows and Linux (Parrot OS/Ubuntu)."
          releaseDraft: true # Tạo dưới dạng bản nháp (Draft) để bạn kiểm tra trước khi bấm Public chính thức
          prerelease: false
          args: ${{ matrix.args }}